<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- [텍스트 포함한 태그] : title{제목} -->
    <title>Youjin's Holiday</title>
</head>

<body>
    <!-- [머리글] : header>h1{제목}+p{내용} -->
    <header>
        <h1>🌿 유진의 휴일 일과</h1>
        <p>저의 휴일 일과를 소개합니다.</p>
    </header>

    <br>

    <!-- 
       [자동 번호, 카드구조, 부모로 이동, 그룹, 반복] 
     : (section#schedule$>h2{제목}+p*3^br)*3
    -->
    <main>
        <section id="schedule1">
            <h2>☀️ 여유로운 아침</h2>
            <p>10:00 - 😴 늦잠 자는 행복</p>
            <p>10:30 - 🛌 유튜브 보며 뒹굴기</p>
            <p>11:00 - 🍰 동네 <mark>빵집</mark> 투어</p>
        </section>
        <br>
        <section id="schedule2">
            <h2>🏃‍♀️ 신나는 오후</h2>
            <p>12:00 - 🍽️ 친구랑 점심 먹기</p>
            <p>13:00 - 🛍️ <mark>소품샵</mark> 구경하기</p>
            <p>16:00 - ☕️ 카페 가기</p>
        </section>
        <br>
        <section id="schedule3">
            <h2>⭐️ 저녁과 밤</h2>
            <p>18:00 - 🍜 맛있는 저녁 시켜먹기</p>
            <p>20:00 - ✍️ 오늘의 <mark>일기</mark> 쓰기</p>
            <p>23:30 - 🌙 뒹구리 하다가 자기</p>
        </section>
    </main>

    <br>

    <!-- [문서 바닥글] : footer>nav>a[href=index.html]+p>small{작성 정보} -->
    <footer>
        <nav>
            <a href="index.html">← 메인으로</a>
        </nav>
        <p><small>🗓️ 작성일 : 2026년 7월 23일</small></p>
    </footer>
</body>

</html>
